<footer class="py-8" style="background:#0a0a0a; border-top: 1px solid rgba(255,255,255,0.05);">
  <div class="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4">

    <p class="font-code text-xs text-slate-700">
      © {{ year }} Carlos Javier Bastian Lérida
    </p>

    <nav class="flex items-center gap-5">
      <button type="button" (click)="openDoc('privacy')" class="font-code text-xs text-slate-700 hover:text-slate-400 transition-colors">{{ t().footer.privacy }}</button>
      <button type="button" (click)="openDoc('cookies')" class="font-code text-xs text-slate-700 hover:text-slate-400 transition-colors">{{ t().footer.cookies }}</button>
      <button type="button" (click)="openDoc('notice')" class="font-code text-xs text-slate-700 hover:text-slate-400 transition-colors">{{ t().footer.legal }}</button>
    </nav>

    <p class="font-code text-xs text-slate-700">
      {{ t().footer.built }} Angular + Tailwind CSS
    </p>

  </div>

  <app-legal-modal [doc]="activeDoc()" [closeLabel]="t().legal.close" (closed)="closeDoc()" />
</footer>
