<header
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
  [class.header-scrolled]="scrolled()">
  <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">

    <span class="font-code text-xs text-slate-600 select-none hidden sm:block">~/carlos-bastian</span>

    <nav class="hidden md:flex items-center gap-8">
      <button (click)="scrollTo('about')"      class="nav-link">{{ t().nav.about }}</button>
      <button (click)="scrollTo('projects')"   class="nav-link">{{ t().nav.projects }}</button>
      <button (click)="scrollTo('skills')"     class="nav-link">{{ t().nav.skills }}</button>
      <button (click)="scrollTo('experience')" class="nav-link">{{ t().nav.experience }}</button>
      <button (click)="scrollTo('contact')"    class="nav-link">{{ t().nav.contact }}</button>
    </nav>

    <div class="flex items-center gap-3">
      <div class="flex items-center rounded-md overflow-hidden" style="border: 1px solid rgba(15,23,42,0.08);">
        <button (click)="setLang('es')" [class.active]="lang() === 'es'" class="font-code text-xs px-3 py-1.5 lang-btn">ES</button>
        <div style="width:1px; height:16px; background:rgba(15,23,42,0.08);"></div>
        <button (click)="setLang('en')" [class.active]="lang() === 'en'" class="font-code text-xs px-3 py-1.5 lang-btn">EN</button>
      </div>

      <button
        (click)="menuOpen.set(!menuOpen())"
        class="md:hidden p-2 text-slate-500 hover:text-slate-900 transition-colors"
        [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'">
        @if (menuOpen()) {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        } @else {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        }
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <div class="md:hidden border-b border-white/5 px-6 pb-6 flex flex-col gap-4" style="background:#ffffff;">
      <button (click)="scrollTo('about')"      class="nav-link text-left py-1">{{ t().nav.about }}</button>
      <button (click)="scrollTo('projects')"   class="nav-link text-left py-1">{{ t().nav.projects }}</button>
      <button (click)="scrollTo('skills')"     class="nav-link text-left py-1">{{ t().nav.skills }}</button>
      <button (click)="scrollTo('experience')" class="nav-link text-left py-1">{{ t().nav.experience }}</button>
      <button (click)="scrollTo('contact')"    class="nav-link text-left py-1">{{ t().nav.contact }}</button>
    </div>
  }
</header>
