@if (doc(); as d) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0" style="background: rgba(15,23,42,0.6); backdrop-filter: blur(4px);" (click)="closed.emit()"></div>

    <div class="relative w-full max-w-2xl max-h-[85vh] rounded-xl p-6 sm:p-8 overflow-y-auto" style="background:#ffffff; border:1px solid rgba(15,23,42,0.08);">

      <button
        (click)="closed.emit()"
        [attr.aria-label]="closeLabel()"
        class="absolute top-4 right-4 text-slate-600 hover:text-slate-900 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>

      <h3 class="text-xl font-bold text-slate-900 mb-1 font-display">{{ d.title }}</h3>
      <p class="font-code text-xs text-slate-600 mb-6">{{ d.updated }}</p>

      <div class="space-y-6">
        @for (section of d.sections; track section.heading) {
          <div>
            <h4 class="text-sm font-semibold text-slate-800 mb-2 font-display">{{ section.heading }}</h4>
            @for (paragraph of section.paragraphs; track paragraph) {
              <p class="text-slate-500 text-sm leading-relaxed mb-2 last:mb-0">{{ paragraph }}</p>
            }
          </div>
        }
      </div>

    </div>
  </div>
}
