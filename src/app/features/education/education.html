<section id="education" class="py-32" style="background:#f8fafc; border-top: 1px solid rgba(15,23,42,0.05);">
  <div class="max-w-4xl mx-auto px-6">

    <div animateOnScroll class="mb-20">
      <p class="font-code text-xs text-slate-600 tracking-widest mb-4">// education</p>
      <h2 class="text-4xl md:text-5xl font-bold text-slate-900 mb-2 font-display">{{ t().education.title }}</h2>
      <div class="section-divider"></div>
    </div>

    <div class="space-y-4">
      @for (item of t().education.items; track item.title; let i = $index) {
        <article animateOnScroll [style.transition-delay]="i * 100 + 'ms'" class="card rounded-xl p-6">

          <div class="flex flex-wrap items-start justify-between gap-3 mb-3">
            <div>
              <h3 class="text-base font-semibold text-slate-900 font-display">{{ item.title }}</h3>
              @if (item.institution) {
                <p class="text-sm font-medium mt-0.5" style="color: #4f46e5;">{{ item.institution }}</p>
              }
            </div>
            <span class="font-code text-xs px-3 py-1 rounded-md"
              style="background: rgba(8,145,178,0.08); color: #0e7490; border: 1px solid rgba(8,145,178,0.2);">
              @if (item.from) { {{ item.from }} — } {{ item.to }}
            </span>
          </div>

          <p class="text-slate-500 text-sm leading-relaxed">{{ item.description }}</p>

        </article>
      }
    </div>

  </div>
</section>
