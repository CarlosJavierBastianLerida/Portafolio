<section id="experience" class="py-32" style="background:#0d0d0d; border-top: 1px solid rgba(255,255,255,0.05);">
  <div class="max-w-4xl mx-auto px-6">

    <div animateOnScroll class="mb-20">
      <p class="font-code text-xs text-slate-600 tracking-widest mb-4">// experience</p>
      <h2 class="text-4xl md:text-5xl font-bold text-slate-100 mb-2">{{ t().experience.title }}</h2>
      <div class="section-divider"></div>
    </div>

    <div class="space-y-4">
      @for (item of t().experience.items; track item.company; let i = $index) {
        <article animateOnScroll [style.transition-delay]="i * 100 + 'ms'" class="card rounded-xl p-6">

          <div class="flex flex-wrap items-start justify-between gap-3 mb-3">
            <div>
              <h3 class="text-base font-semibold text-slate-100">{{ item.role }}</h3>
              <p class="text-sm gradient-text font-medium mt-0.5">{{ item.company }}</p>
            </div>
            <span class="font-code text-xs px-3 py-1 rounded-md"
              style="background: rgba(34,211,238,0.06); color: #67e8f9; border: 1px solid rgba(34,211,238,0.15);">
              @if (item.from) { {{ item.from }} — } {{ item.to }}
            </span>
          </div>

          <p class="text-slate-500 text-sm leading-relaxed">{{ item.description }}</p>

        </article>
      }
    </div>

  </div>
</section>
